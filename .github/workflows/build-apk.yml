name: Build STAR COMMUNICATION

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== SETTINGS ==="
          cat settings.gradle
          echo "=== APP BUILD ==="
          cat app/build.gradle

      - name: Build STAR COMMUNICATION APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload STAR COMMUNICATION APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
