name: Build STAR COMMUNICATION

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app || true
          echo "=== APP BUILD FILE ==="
          cat app/build.gradle || true
          echo "=== SETTINGS ==="
          cat settings.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android tasks
        run: gradle :app:tasks --all

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-debug-apk
          path: app/build/outputs/apk/debug/*.apk
